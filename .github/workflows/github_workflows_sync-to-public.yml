name: Sync to public repository

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Temporary: allow actions that still target Node 20 to run until they are upgraded.
      # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    concurrency:
      group: sync-to-public
      cancel-in-progress: true

    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false  # important: we will use the PAT, not GITHUB_TOKEN

      - name: Ensure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add public remote
        env:
          PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          if [ -z "$PUBLIC_REPO_PAT" ]; then
            echo "PUBLIC_REPO_PAT is not set. Aborting."
            exit 1
          fi
          # Use a token in the URL (token is masked by Actions)
          PUBLIC_URL="https://x-access-token:${PUBLIC_REPO_PAT}@github.com/andmair/Align42-Public.git"
          git remote remove public 2>/dev/null || true
          git remote add public "$PUBLIC_URL"

      - name: Verify PUBLIC_REPO_PAT has access to the target repo
        env:
          PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          # Echoing helpful guidance if the token cannot access the target repo
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $PUBLIC_REPO_PAT" https://api.github.com/repos/andmair/Align42-Public)
          if [ "$status" -ne 200 ]; then
            echo "PUBLIC_REPO_PAT cannot access https://github.com/andmair/Align42-Public (HTTP $status)."
            echo "Ensure the PAT has the required scopes (repo) and access to the target repository, or use a deploy key/GitHub App with push permission."
            exit 1
          fi

      - name: Push branches (non-destructive)
        run: |
          # Push all branches and prune remote branches that were deleted locally
          git push --prune public refs/heads/*:refs/heads/*

      - name: Push tags
        run: |
          git push --tags public

      # Optional destructive mirror (uncomment if you intend to fully mirror, including deletions)
      # - name: Mirror push (DANGEROUS)
      #   if: github.event_name == 'workflow_dispatch' # limit when it can be run
      #   run: git push --mirror public
