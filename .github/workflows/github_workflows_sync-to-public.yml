name: Sync to public repository

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-to-public
      cancel-in-progress: true

    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false  # important: we will configure the public remote explicitly

      - name: Ensure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Diagnose PUBLIC_REPO_PAT (if set)
        env:
          PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          if [ -z "$PUBLIC_REPO_PAT" ]; then
            echo "PUBLIC_REPO_PAT not set."
          else
            echo "PUBLIC_REPO_PAT present — checking identity and scopes (masked in logs)..."
            curl -s -H "Authorization: token $PUBLIC_REPO_PAT" https://api.github.com/user || true
            curl -sI -H "Authorization: token $PUBLIC_REPO_PAT" https://api.github.com/user | grep -i X-OAuth-Scopes || true
            user=$(curl -s -H "Authorization: token $PUBLIC_REPO_PAT" https://api.github.com/user | sed -n 's/.*"login": *"\([^"]*\)".*/\1/p' || echo "")
            if [ -n "$user" ]; then
              echo "Checking permission for $user on andmair/Align42-Public:"
              curl -s -H "Authorization: token $PUBLIC_REPO_PAT" https://api.github.com/repos/andmair/Align42-Public/collaborators/$user/permission || true
            fi
          fi

      - name: Check for deploy key secret
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "DEPLOY_KEY secret not set in this repo."
          else
            echo "DEPLOY_KEY secret is present (length masked)."
          fi

      - name: Configure public remote (SSH deploy key preferred, fallback to PAT)
        env:
          PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$DEPLOY_KEY" ]; then
            echo "Configuring SSH deploy key..."
            mkdir -p ~/.ssh
            printf '%s' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git remote remove public 2>/dev/null || true
            git remote add public git@github.com:andmair/Align42-Public.git
            echo "Public remote set to SSH git@github.com:andmair/Align42-Public.git"
          elif [ -n "$PUBLIC_REPO_PAT" ]; then
            echo "Configuring public remote using PUBLIC_REPO_PAT and verifying access..."
            PUBLIC_URL="https://x-access-token:${PUBLIC_REPO_PAT}@github.com/andmair/Align42-Public.git"
            git remote remove public 2>/dev/null || true
            git remote add public "$PUBLIC_URL"

            # Deeper verification: capture body + status so we can see why GitHub might reject requests.
            status=$(curl -s -o /tmp/resp -w "%{http_code}" -H "Authorization: token $PUBLIC_REPO_PAT" https://api.github.com/repos/andmair/Align42-Public)
            echo "Repository API HTTP status: $status"
            if [ "$status" -ne 200 ]; then
              echo "Repository API response body:"
              sed -n '1,200p' /tmp/resp || true
              echo "PUBLIC_REPO_PAT cannot access https://github.com/andmair/Align42-Public (HTTP $status)."
              echo "Ensure the PAT includes the target repository with Code (Contents) read & write, the token is not expired, and the token owner has write access."
              exit 1
            fi
            echo "PAT verification succeeded (HTTP 200)."
          else
            echo "ERROR: neither DEPLOY_KEY nor PUBLIC_REPO_PAT is set. Cannot configure public remote."
            exit 1
          fi

      - name: Push branches (non-destructive)
        run: |
          # Push all branches and prune remote branches that were deleted locally
          git push --prune public refs/heads/*:refs/heads/*

      - name: Push tags
        run: |
          git push --tags public
